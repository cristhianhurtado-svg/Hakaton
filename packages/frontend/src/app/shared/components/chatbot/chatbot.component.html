<!-- Floating Chat Button -->
<button
  class="chat-fab"
  [class.chat-fab--open]="isOpen"
  (click)="toggle()"
  [attr.aria-label]="isOpen ? 'Cerrar chat' : 'Abrir asistente Evo'"
  type="button"
>
  <i [class]="isOpen ? 'pi pi-times' : 'pi pi-comments'" class="chat-fab__icon"></i>
  <span class="chat-fab__label" *ngIf="!isOpen">Evo</span>
</button>

<!-- Chat Window -->
<div class="chat-window" *ngIf="isOpen" role="dialog" aria-label="Asistente Evo">

  <!-- Header -->
  <div class="chat-window__header">
    <div class="chat-window__header-left">
      <div class="chat-window__avatar">
        <span>E</span>
      </div>
      <div>
        <div class="chat-window__name">Evo</div>
        <div class="chat-window__status">
          <span class="chat-window__dot"></span> Asistente Conecta 2.0
        </div>
      </div>
    </div>
    <button class="chat-window__close" (click)="toggle()" aria-label="Cerrar" type="button">
      <i class="pi pi-minus"></i>
    </button>
  </div>

  <!-- Messages -->
  <div class="chat-window__messages" #messagesContainer>
    <div
      class="chat-msg"
      *ngFor="let msg of messages"
      [class.chat-msg--user]="msg.role === 'user'"
      [class.chat-msg--assistant]="msg.role === 'assistant'"
    >
      <div class="chat-msg__avatar" *ngIf="msg.role === 'assistant'">E</div>
      <div class="chat-msg__bubble" [innerHTML]="msg.content | chatFormat"></div>
    </div>

    <!-- Typing indicator -->
    <div class="chat-msg chat-msg--assistant" *ngIf="isTyping">
      <div class="chat-msg__avatar">E</div>
      <div class="chat-msg__bubble chat-msg__typing">
        <span></span><span></span><span></span>
      </div>
    </div>
  </div>

  <!-- Input -->
  <div class="chat-window__input">
    <input
      type="text"
      [(ngModel)]="userInput"
      (keydown)="onKeydown($event)"
      placeholder="Escribe tu pregunta..."
      class="chat-window__input-field"
      autocomplete="off"
    />
    <button
      class="chat-window__send"
      (click)="onSend()"
      [disabled]="!userInput.trim()"
      type="button"
      aria-label="Enviar"
    >
      <i class="pi pi-send"></i>
    </button>
  </div>
</div>
