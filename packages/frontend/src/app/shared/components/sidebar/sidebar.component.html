<nav class="sidebar" [class.sidebar--collapsed]="collapsed" role="navigation" aria-label="Navegación principal">
  <!-- Brand Wordmark -->
  <a routerLink="/dashboard" class="sidebar__brand" *ngIf="!collapsed">
    <span class="sidebar__brand-name">Conecta</span><span class="sidebar__brand-version">2.0</span>
  </a>
  <a routerLink="/dashboard" class="sidebar__brand sidebar__brand--collapsed" *ngIf="collapsed" title="Conecta 2.0">
    <span class="sidebar__brand-icon">C</span>
  </a>

  <!-- Toggle -->
  <button
    class="sidebar__toggle"
    (click)="toggleCollapse()"
    [attr.aria-label]="collapsed ? 'Expandir menú' : 'Colapsar menú'"
    type="button"
  >
    <i [class]="collapsed ? 'pi pi-angle-right' : 'pi pi-angle-left'"></i>
  </button>

  <!-- Main Navigation -->
  <ul class="sidebar__nav">
    <li *ngFor="let item of navItems" class="sidebar__nav-item">
      <a
        [routerLink]="item.route"
        routerLinkActive="sidebar__nav-link--active"
        class="sidebar__nav-link"
        [attr.title]="collapsed ? item.label : null"
      >
        <i [class]="item.icon" class="sidebar__nav-icon"></i>
        <span class="sidebar__nav-label" *ngIf="!collapsed">{{ item.label }}</span>
      </a>
    </li>
  </ul>

  <!-- Admin Section -->
  <div class="sidebar__section" *ngIf="isAdmin">
    <div class="sidebar__section-title" *ngIf="!collapsed">Administración</div>
    <ul class="sidebar__nav">
      <li *ngFor="let item of adminItems" class="sidebar__nav-item">
        <a
          [routerLink]="item.route"
          routerLinkActive="sidebar__nav-link--active"
          class="sidebar__nav-link"
          [attr.title]="collapsed ? item.label : null"
        >
          <i [class]="item.icon" class="sidebar__nav-icon"></i>
          <span class="sidebar__nav-label" *ngIf="!collapsed">{{ item.label }}</span>
        </a>
      </li>
    </ul>
  </div>

  <!-- Footer -->
  <div class="sidebar__footer" *ngIf="!collapsed">
    <span class="sidebar__footer-text">Seguros Bolívar</span>
    <span class="sidebar__footer-sub">Open Insurance Platform</span>
  </div>
</nav>
